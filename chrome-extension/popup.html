<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Compass ASIN Collector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hd">
      <div class="logo">F</div>
      <div>
        <div class="title">Compass ASIN Collector</div>
        <div class="subtitle">Amazon検索結果 → Compass受信トレイ</div>
      </div>
    </header>

    <section class="meta">
      <div class="meta-row">
        <span>検索キーワード</span>
        <strong id="query">—</strong>
      </div>
      <div class="meta-row">
        <span>検出ASIN</span>
        <strong><span id="count">0</span> 件</strong>
      </div>
      <div class="meta-row">
        <span>取得時刻</span>
        <strong id="capturedAt">—</strong>
      </div>
    </section>

    <section class="endpoint">
      <label for="endpoint">送信先</label>
      <input
        id="endpoint"
        type="text"
        value="http://localhost:3000/api/ingest"
      />
      <label for="token" style="margin-top: 8px">接続トークン（受信トレイで発行）</label>
      <input id="token" type="password" placeholder="X-Compass-Token" />
    </section>

    <section class="actions">
      <button id="send" class="btn-primary">Compassへ送信</button>
      <button id="copy" class="btn-secondary">ASINをコピー</button>
      <button id="rescan" class="btn-ghost">再スキャン</button>
    </section>

    <div id="status" class="status"></div>

    <section class="preview">
      <div class="preview-head">プレビュー（先頭10件）</div>
      <ul id="list"></ul>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
